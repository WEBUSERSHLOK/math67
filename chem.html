<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honors Chemistry I — Unit 1 Digital Course</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- KaTeX for crisp LaTeX math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .code-font {
            font-family: 'Fira Code', monospace;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen custom-scrollbar">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const MASTER_OBJECTIVES = [
            { id: 1, text: "Differentiate inorganic chemistry and organic chemistry.", section: "Section 1", targetSec: 1 },
            { id: 2, text: "Differentiate science and technology.", section: "Section 2", targetSec: 2 },
            { id: 3, text: "Describe law, hypothesis, theory, controlled experiment.", section: "Section 3", targetSec: 3 },
            { id: 4, text: "Make a complete graph.", section: "Section 4", targetSec: 4 },
            { id: 5, text: "Measure properly.", section: "Section 5", targetSec: 5 },
            { id: 6, text: "Differentiate between qualitative and quantitative descriptions.", section: "Section 6", targetSec: 6 },
            { id: 7, text: "Know meaning/use of SI base units (m, kg, s, K, mol) & prefixes (k, h, da, d, c, m, µ, n).", section: "Section 7", targetSec: 7 },
            { id: 8, text: "Convert within the SI system.", section: "Section 8", targetSec: 8 },
            { id: 9, text: "State relationship between cm³ & mL; and dm³ & L.", section: "Section 9", targetSec: 9 },
            { id: 10, text: "Differentiate between mass and weight.", section: "Section 10", targetSec: 10 },
            { id: 11, text: "Convert between Celsius and Kelvin temperature scales.", section: "Section 11", targetSec: 11 },
            { id: 12, text: "Describe how uncertainty is related to measurement.", section: "Section 12", targetSec: 12 },
            { id: 13, text: "Determine number of significant figures in a measurement.", section: "Section 13", targetSec: 13 },
            { id: 14, text: "Follow rules of significant figures in calculations.", section: "Section 14", targetSec: 14 },
            { id: 15, text: "Convert numbers from scientific notation to standard form and vice versa.", section: "Section 15", targetSec: 15 },
            { id: 16, text: "Use scientific notation in mathematics (with and without calculator).", section: "Section 15", targetSec: 15 },
            { id: 17, text: "Solve problems using unit analysis (dimensional analysis, fence-posting, factor-label).", section: "Section 16", targetSec: 16 },
            { id: 18, text: "Solve problems using the 'five step method of solving problems'.", section: "Section 17", targetSec: 17 },
            { id: 19, text: "Define key terminology (chemistry, macroscopic, microscopic, derived units, non-SI, absolute/relative scales, IV, DV, relationships).", section: "Section 18", targetSec: 18 }
        ];

        const COURSE_SECTIONS = [
            { id: 1, title: "Section 1 — Introduction to Chemistry", desc: "What chemistry is, macroscopic vs microscopic, areas of chemistry, inorganic vs organic." },
            { id: 2, title: "Section 2 — Science and Technology", desc: "Science definition, technology definition, interactions, real-world examples, misconceptions." },
            { id: 3, title: "Section 3 — Scientific Method", desc: "Observations, hypotheses, variables (IV, DV, Control), law vs theory, experimental design." },
            { id: 4, title: "Section 4 — Graphing", desc: "Parts of a graph, scale, axes, best-fit lines, direct/inverse relationships." },
            { id: 5, title: "Section 5 — Measurement", desc: "Proper reading, instruments, precision, estimated digits, uncertainty." },
            { id: 6, title: "Section 6 — Qualitative vs. Quantitative", desc: "Qualitative observations vs quantitative measurements, classification activities." },
            { id: 7, title: "Section 7 — SI System", desc: "Base units (m, kg, s, K, mol), metric prefixes (kilo to nano), power of 10 ladder." },
            { id: 8, title: "Section 8 — SI Conversions", desc: "Step-by-step metric conversions, unit cancellation, multi-step metric problems." },
            { id: 9, title: "Section 9 — Volume Relationships", desc: "1 cm³ = 1 mL and 1 dm³ = 1 L equivalences and visual 3D derivations." },
            { id: 10, title: "Section 10 — Mass vs. Weight", desc: "Mass vs gravity-dependent weight, spring scale vs balance, cosmic environments." },
            { id: 11, title: "Section 11 — Temperature", desc: "Celsius, Kelvin, absolute zero, relative vs absolute scales, K = °C + 273.15." },
            { id: 12, title: "Section 12 — Uncertainty and Measurement", desc: "Sources of uncertainty, instrument limits, expressing measurement error." },
            { id: 13, title: "Section 13 — Significant Figures", desc: "Atlantic-Pacific rule, nonzero, captive, leading, trailing zeros, exact numbers." },
            { id: 14, title: "Section 14 — Sig Figs in Calculations", desc: "Addition/Subtraction (decimal places) vs Multiplication/Division (sig figs)." },
            { id: 15, title: "Section 15 — Scientific Notation", desc: "Standard to sci notation, exponent math, calculator EE/EXP button mastery." },
            { id: 16, title: "Section 16 — Dimensional Analysis", desc: "Unit analysis, factor-label method, conversion factors, multi-step fence posting." },
            { id: 17, title: "Section 17 — Five-Step Method of Problem Solving", desc: "Given, Unknown, Formula/Setup, Calculation, Check (Units/Sig Figs/Sense)." },
            { id: 18, title: "Section 18 — Key Vocabulary & Master Review", desc: "Complete interactive glossary, flashcards, diagnostic quiz, master exam." }
        ];

        function ChemistryApp() {
            const [activeTab, setActiveTab] = useState('course-map'); // 'course-map', 'checklist', 'section-view', 'mistakes', 'tracker'
            const [activeSectionId, setActiveSectionId] = useState(1);
            const [completedSections, setCompletedSections] = useState([1]);
            const [slideIndex, setSlideIndex] = useState(0);
            const [mistakeBank, setMistakeBank] = useState([]);
            const [isChatMinimized, setIsChatMinimized] = useState(false);

            // Sorting Activity State (Section 1)
            const [sortingItems, setSortingItems] = useState([
                { id: 1, name: "Methane gas (CH₄)", category: "organic", placed: null },
                { id: 2, name: "Table salt (NaCl)", category: "inorganic", placed: null },
                { id: 3, name: "Glucose sugar (C₆H₁₂O₆)", category: "organic", placed: null },
                { id: 4, name: "Water (H₂O)", category: "inorganic", placed: null },
                { id: 5, name: "DNA molecule", category: "organic", placed: null },
                { id: 6, name: "Rust / Iron Oxide (Fe₂O₃)", category: "inorganic", placed: null },
                { id: 7, name: "Carbon Dioxide (CO₂) [Exception]", category: "inorganic", placed: null },
                { id: 8, name: "Rubbing Alcohol (C₃H₈O)", category: "organic", placed: null },
            ]);
            const [sortingScore, setSortingScore] = useState(null);

            // Quiz state
            const [mcqAnswers, setMcqAnswers] = useState({});
            const [shortAnswerText, setShortAnswerText] = useState({});
            const [tfAnswers, setTfAnswers] = useState({});

            // Chatbot State
            const [chatMessages, setChatMessages] = useState([
                { sender: 'bot', text: "Hello! I am your AI Chemistry Tutor for Honors Chemistry I. Ask me anything about any section!" }
            ]);
            const [chatInput, setChatInput] = useState('');

            const openSection = (secId) => {
                setActiveSectionId(secId);
                setSlideIndex(0);
                setActiveTab('section-view');
            };

            const advanceToNextSection = () => {
                if (!completedSections.includes(activeSectionId)) {
                    setCompletedSections(prev => [...prev, activeSectionId]);
                }
                if (activeSectionId < COURSE_SECTIONS.length) {
                    const nextId = activeSectionId + 1;
                    setActiveSectionId(nextId);
                    setSlideIndex(0);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    setActiveTab('tracker');
                }
            };

            const handlePlaceItem = (itemId, targetCategory) => {
                setSortingItems(prev => prev.map(item => item.id === itemId ? { ...item, placed: targetCategory } : item));
            };

            const checkSortingResults = () => {
                let correctCount = 0;
                sortingItems.forEach(item => {
                    if (item.placed === item.category) correctCount++;
                });
                setSortingScore(correctCount);
            };

            const resetSorting = () => {
                setSortingItems(prev => prev.map(item => ({ ...item, placed: null })));
                setSortingScore(null);
            };

            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!chatInput.trim()) return;

                const userMsg = chatInput.trim();
                const newMessages = [...chatMessages, { sender: 'user', text: userMsg }];
                setChatMessages(newMessages);
                setChatInput('');

                setTimeout(() => {
                    let botReply = `Great inquiry regarding Section ${activeSectionId}! Focus on identifying key observable properties and underlying atomic structures. Would you like a step-by-step hint?`;
                    const lower = userMsg.toLowerCase();
                    if (lower.includes("organic") || lower.includes("inorganic")) {
                        botReply = "Organic chemistry primarily focuses on carbon-based compounds (except simple carbonates and oxides like CO/CO₂). Inorganic chemistry deals with metals, minerals, and non-carbon networks.";
                    }
                    setChatMessages([...newMessages, { sender: 'bot', text: botReply }]);
                }, 400);
            };

            const currentSection = COURSE_SECTIONS.find(s => s.id === activeSectionId) || COURSE_SECTIONS[0];
            const currentObjectives = MASTER_OBJECTIVES.filter(o => o.targetSec === activeSectionId);

            return (
                <div className="min-h-screen flex flex-col bg-slate-900 text-slate-100">
                    {/* Header */}
                    <header className="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg font-bold text-white text-xl">
                                    🧪
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-lg tracking-tight text-white">Honors Chemistry I</h1>
                                    <p className="text-xs text-cyan-400 font-medium">Unit 1: Full Curriculum Platform</p>
                                </div>
                            </div>

                            <nav className="flex items-center space-x-2 text-sm flex-wrap gap-y-1">
                                <button 
                                    onClick={() => setActiveTab('course-map')}
                                    className={`px-3 py-1.5 rounded-lg transition font-medium ${activeTab === 'course-map' ? 'bg-cyan-600 text-white' : 'text-slate-300 hover:bg-slate-700'}`}>
                                    🗺️ Course Map
                                </button>
                                <button 
                                    onClick={() => setActiveTab('checklist')}
                                    className={`px-3 py-1.5 rounded-lg transition font-medium ${activeTab === 'checklist' ? 'bg-cyan-600 text-white' : 'text-slate-300 hover:bg-slate-700'}`}>
                                    📋 Objective Checklist
                                </button>
                                <button 
                                    onClick={() => setActiveTab('section-view')}
                                    className={`px-3 py-1.5 rounded-lg transition font-medium ${activeTab === 'section-view' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-700'}`}>
                                    ⚡ Section {activeSectionId}
                                </button>
                                <button 
                                    onClick={() => setActiveTab('tracker')}
                                    className={`px-3 py-1.5 rounded-lg transition font-medium ${activeTab === 'tracker' ? 'bg-purple-600 text-white' : 'text-slate-300 hover:bg-slate-700'}`}>
                                    📊 Progress Dashboard
                                </button>
                                <button 
                                    onClick={() => setActiveTab('mistakes')}
                                    className={`px-3 py-1.5 rounded-lg transition font-medium ${activeTab === 'mistakes' ? 'bg-rose-600 text-white' : 'text-slate-300 hover:bg-slate-700'}`}>
                                    ⚠️ Mistake Bank ({mistakeBank.length})
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

                        {/* TAB 1: COURSE MAP */}
                        {activeTab === 'course-map' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-slate-800 to-slate-800/60 p-6 rounded-2xl border border-slate-700">
                                    <h2 className="text-2xl font-bold text-white mb-2 flex items-center gap-2">
                                        <span>🗺️</span> Unit 1 Course Roadmap
                                    </h2>
                                    <p className="text-slate-300 text-sm leading-relaxed">
                                        All 18 sections are accessible below. Click any section to jump directly into its lessons and practice activities.
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {COURSE_SECTIONS.map((sec) => (
                                        <div key={sec.id} className="p-5 rounded-xl border bg-slate-800/70 border-slate-700 hover:border-indigo-500 transition-all flex flex-col justify-between">
                                            <div>
                                                <div className="flex justify-between items-start mb-2">
                                                    <span className={`text-xs px-2.5 py-1 rounded-md font-semibold ${sec.id === activeSectionId ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300'}`}>
                                                        {sec.id === activeSectionId ? 'CURRENT' : `SECTION ${sec.id}`}
                                                    </span>
                                                    {completedSections.includes(sec.id) && (
                                                        <span className="text-emerald-400 text-xs font-semibold">✓ Completed</span>
                                                    )}
                                                </div>
                                                <h3 className="font-bold text-base text-slate-100 mb-1">{sec.title}</h3>
                                                <p className="text-xs text-slate-400 leading-relaxed mb-4">{sec.desc}</p>
                                            </div>
                                            <button 
                                                onClick={() => openSection(sec.id)}
                                                className="w-full py-2 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs transition flex items-center justify-center gap-2 mt-auto">
                                                <span>Launch Section {sec.id}</span>
                                                <span>→</span>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: OBJECTIVE CHECKLIST */}
                        {activeTab === 'checklist' && (
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                                    <h2 className="text-2xl font-bold text-white mb-2 flex items-center gap-2">
                                        <span>📋</span> Master Objective Checklist (19 Objectives)
                                    </h2>
                                    <p className="text-slate-300 text-sm">
                                        Track curriculum objectives and jump directly to their respective sections.
                                    </p>
                                </div>

                                <div className="bg-slate-800/80 rounded-xl border border-slate-700 overflow-x-auto">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-slate-900/80 text-xs text-slate-400 uppercase border-b border-slate-700">
                                            <tr>
                                                <th className="py-3.5 px-4">#</th>
                                                <th className="py-3.5 px-4">Objective Statement</th>
                                                <th className="py-3.5 px-4">Course Section</th>
                                                <th className="py-3.5 px-4 text-center">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-700/50">
                                            {MASTER_OBJECTIVES.map((obj) => (
                                                <tr key={obj.id} className="hover:bg-slate-700/30 transition">
                                                    <td className="py-3 px-4 font-bold text-cyan-400">{obj.id}</td>
                                                    <td className="py-3 px-4 text-slate-200">{obj.text}</td>
                                                    <td className="py-3 px-4 text-xs font-semibold text-indigo-300">{obj.section}</td>
                                                    <td className="py-3 px-4 text-center">
                                                        <button 
                                                            onClick={() => openSection(obj.targetSec)}
                                                            className="px-3 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition">
                                                            Go to Section {obj.targetSec}
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: DYNAMIC SECTION VIEWER */}
                        {activeTab === 'section-view' && (
                            <div className="space-y-8">
                                <div className="bg-gradient-to-r from-indigo-900/60 via-slate-800 to-slate-900 p-6 rounded-2xl border border-indigo-500/40 shadow-xl flex flex-wrap items-center justify-between gap-4">
                                    <div>
                                        <span className="px-3 py-1 rounded-full text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/40">
                                            SECTION {activeSectionId} OF 18
                                        </span>
                                        <h2 className="text-3xl font-extrabold text-white tracking-tight mt-2">
                                            {currentSection.title}
                                        </h2>
                                        <p className="text-slate-300 text-sm mt-1 max-w-2xl">
                                            {currentSection.desc}
                                        </p>
                                    </div>

                                    {/* Direct Section Switcher Dropdown */}
                                    <div className="flex items-center gap-3">
                                        <label className="text-xs text-slate-400 font-semibold">Jump to:</label>
                                        <select 
                                            value={activeSectionId} 
                                            onChange={(e) => openSection(Number(e.target.value))}
                                            className="bg-slate-900 text-slate-200 text-xs font-semibold p-2.5 rounded-lg border border-slate-700 focus:outline-none focus:border-indigo-500">
                                            {COURSE_SECTIONS.map(s => (
                                                <option key={s.id} value={s.id}>
                                                    Section {s.id}: {s.title.split('—')[1]}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                {/* Dynamic Lesson Panel */}
                                <div className="bg-slate-800/90 rounded-2xl border border-slate-700 p-6 md:p-8 shadow-2xl min-h-[500px]">
                                    
                                    {/* Section 1 Custom Interactive Suite */}
                                    {activeSectionId === 1 ? (
                                        <div className="space-y-6">
                                            <div className="flex items-center gap-2 border-b border-slate-700 pb-3 flex-wrap">
                                                <span className="text-xs font-bold text-slate-400">Lesson Slides:</span>
                                                {[0, 1, 2, 3].map(idx => (
                                                    <button 
                                                        key={idx}
                                                        onClick={() => setSlideIndex(idx)}
                                                        className={`px-3 py-1 rounded text-xs font-bold transition ${slideIndex === idx ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                                                        {idx === 0 && "1. Overview"}
                                                        {idx === 1 && "2. Macroscopic vs Microscopic"}
                                                        {idx === 2 && "3. Sorting Lab"}
                                                        {idx === 3 && "4. Practice Checkpoint"}
                                                    </button>
                                                ))}
                                            </div>

                                            {slideIndex === 0 && (
                                                <div className="space-y-4">
                                                    <h3 className="text-xl font-bold text-indigo-300">Chemistry: The Central Science</h3>
                                                    <p className="text-sm text-slate-300 leading-relaxed">
                                                        Chemistry is the study of matter, its structure, physical and chemical properties, and the energy changes that occur during transformations.
                                                    </p>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                                                        <div className="p-4 bg-slate-900 rounded-xl border border-emerald-500/30">
                                                            <h4 className="font-bold text-emerald-400 text-sm mb-1">Organic Chemistry</h4>
                                                            <p className="text-xs text-slate-300">Deals primarily with carbon-containing molecules bonded to hydrogen (e.g., fuels, sugars, proteins).</p>
                                                        </div>
                                                        <div className="p-4 bg-slate-900 rounded-xl border border-cyan-500/30">
                                                            <h4 className="font-bold text-cyan-400 text-sm mb-1">Inorganic Chemistry</h4>
                                                            <p className="text-xs text-slate-300">Deals with minerals, salts, metals, and non-carbon networks, plus simple oxides like CO and CO₂.</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {slideIndex === 1 && (
                                                <div className="space-y-4">
                                                    <h3 className="text-xl font-bold text-indigo-300">Macroscopic vs. Microscopic Observations</h3>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                        <div className="p-4 bg-slate-900 rounded-xl border border-slate-700">
                                                            <h4 className="font-bold text-cyan-300 text-sm">Macroscopic Realm</h4>
                                                            <p className="text-xs text-slate-300 mt-1">Directly visible to human senses: color change, precipitate formation, bubble evolution, and mass readings.</p>
                                                        </div>
                                                        <div className="p-4 bg-slate-900 rounded-xl border border-slate-700">
                                                            <h4 className="font-bold text-purple-300 text-sm">Microscopic Realm</h4>
                                                            <p className="text-xs text-slate-300 mt-1">Atomic and molecular scale: electron sharing, bond breakage, ion lattices, and kinetic collisions.</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {slideIndex === 2 && (
                                                <div className="space-y-4">
                                                    <div className="flex justify-between items-center">
                                                        <h3 className="text-xl font-bold text-indigo-300">Interactive Sorting Lab</h3>
                                                        <button onClick={resetSorting} className="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs">Reset</button>
                                                    </div>
                                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                                        <div className="bg-slate-900 p-4 rounded-xl space-y-2">
                                                            <h4 className="text-xs font-bold text-slate-300">Substances to Classify</h4>
                                                            {sortingItems.map(item => (
                                                                <div key={item.id} className="p-2 bg-slate-800 rounded flex items-center justify-between text-xs">
                                                                    <span>{item.name}</span>
                                                                    <div className="space-x-1">
                                                                        <button onClick={() => handlePlaceItem(item.id, 'organic')} className={`px-2 py-0.5 rounded text-[11px] font-bold ${item.placed === 'organic' ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-emerald-300'}`}>Organic</button>
                                                                        <button onClick={() => handlePlaceItem(item.id, 'inorganic')} className={`px-2 py-0.5 rounded text-[11px] font-bold ${item.placed === 'inorganic' ? 'bg-cyan-600 text-white' : 'bg-slate-700 text-cyan-300'}`}>Inorganic</button>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                            <button onClick={checkSortingResults} className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 rounded text-xs font-bold text-white mt-2">Check Answers</button>
                                                            {sortingScore !== null && (
                                                                <p className="text-xs text-center font-bold text-emerald-400 mt-1">{sortingScore} / {sortingItems.length} Correct!</p>
                                                            )}
                                                        </div>
                                                        <div className="grid grid-cols-1 gap-2">
                                                            <div className="bg-emerald-950/30 border border-emerald-500/30 p-3 rounded-xl min-h-[100px]">
                                                                <span className="text-xs font-bold text-emerald-400">Organic Bin</span>
                                                                {sortingItems.filter(i => i.placed === 'organic').map(i => <div key={i.id} className="text-[11px] text-emerald-200 mt-1">• {i.name}</div>)}
                                                            </div>
                                                            <div className="bg-cyan-950/30 border border-cyan-500/30 p-3 rounded-xl min-h-[100px]">
                                                                <span className="text-xs font-bold text-cyan-400">Inorganic Bin</span>
                                                                {sortingItems.filter(i => i.placed === 'inorganic').map(i => <div key={i.id} className="text-[11px] text-cyan-200 mt-1">• {i.name}</div>)}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {slideIndex === 3 && (
                                                <div className="space-y-4">
                                                    <h3 className="text-xl font-bold text-indigo-300">Check Your Mastery</h3>
                                                    <div className="p-4 bg-slate-900 rounded-xl space-y-2">
                                                        <p className="text-xs text-slate-200 font-semibold">Which of the following is organic?</p>
                                                        <div className="grid grid-cols-2 gap-2 text-xs">
                                                            {['NaCl (Table Salt)', 'C6H12O6 (Glucose)', 'H2O (Water)', 'Fe2O3 (Rust)'].map((opt, i) => (
                                                                <button 
                                                                    key={i} 
                                                                    onClick={() => setMcqAnswers(prev => ({ ...prev, s1q1: i }))}
                                                                    className={`p-2 rounded text-left ${mcqAnswers.s1q1 === i ? (i === 1 ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white') : 'bg-slate-800 text-slate-300'}`}>
                                                                    {opt}
                                                                </button>
                                                            ))}
                                                        </div>
                                                        {mcqAnswers.s1q1 !== undefined && (
                                                            <p className="text-xs text-emerald-400 font-bold pt-1">
                                                                {mcqAnswers.s1q1 === 1 ? "✓ Correct! Glucose contains carbon bonded into organic rings." : "Try again: look for carbon molecules."}
                                                            </p>
                                                        )}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        /* General Dynamic View for Sections 2 through 18 */
                                        <div className="space-y-6">
                                            <div className="border-b border-slate-700 pb-4">
                                                <h3 className="text-2xl font-bold text-indigo-400">
                                                    {currentSection.title}
                                                </h3>
                                                <p className="text-slate-300 text-sm mt-1">
                                                    {currentSection.desc}
                                                </p>
                                            </div>

                                            <div className="bg-slate-900/80 p-5 rounded-xl border border-slate-700">
                                                <h4 className="font-bold text-sm text-cyan-300 mb-2">Target Objectives for this Section:</h4>
                                                {currentObjectives.length > 0 ? (
                                                    <ul className="space-y-2">
                                                        {currentObjectives.map(obj => (
                                                            <li key={obj.id} className="text-xs text-slate-300 flex items-start gap-2">
                                                                <span className="text-cyan-400 font-bold">#{obj.id}</span>
                                                                <span>{obj.text}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                ) : (
                                                    <p className="text-xs text-slate-400">Covers foundational honors topics and problem-solving workflows.</p>
                                                )}
                                            </div>

                                            <div className="p-5 bg-indigo-950/30 rounded-xl border border-indigo-500/30 space-y-2">
                                                <h4 className="font-bold text-sm text-indigo-300">Interactive Section Notes & Study Targets</h4>
                                                <p className="text-xs text-slate-300 leading-relaxed">
                                                    Review standard notations, laboratory setups, and equations specific to {currentSection.title}. Use the AI Tutor widget below to ask specific conceptual questions or request step-by-step sample calculations.
                                                </p>
                                            </div>
                                        </div>
                                    )}

                                    {/* Action Bar to Advance */}
                                    <div className="pt-8 mt-8 border-t border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-4">
                                        <button 
                                            disabled={activeSectionId <= 1}
                                            onClick={() => openSection(activeSectionId - 1)}
                                            className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-300 text-sm font-medium">
                                            ← Previous Section
                                        </button>

                                        <button 
                                            onClick={advanceToNextSection}
                                            className="px-8 py-3 rounded-xl bg-gradient-to-r from-cyan-500 via-indigo-600 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-extrabold text-sm shadow-xl transition transform hover:-translate-y-0.5 flex items-center gap-2">
                                            <span>
                                                {activeSectionId < 18 ? `Complete & Continue to Section ${activeSectionId + 1}` : "Complete Unit 1 & View Dashboard"}
                                            </span>
                                            <span>→</span>
                                        </button>
                                    </div>

                                </div>
                            </div>
                        )}

                        {/* TAB 4: MISTAKE BANK */}
                        {activeTab === 'mistakes' && (
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                                    <h2 className="text-2xl font-bold text-white mb-2 flex items-center gap-2">
                                        <span>⚠️</span> Mistake Bank & Review
                                    </h2>
                                    <p className="text-slate-300 text-sm">
                                        Review flagged concepts to turn misunderstandings into mastery.
                                    </p>
                                </div>
                                <div className="p-8 bg-slate-800/50 rounded-xl border border-slate-700 text-center text-slate-400">
                                    <p className="text-base font-semibold">✨ All recorded mistakes will populate here automatically.</p>
                                </div>
                            </div>
                        )}

                        {/* TAB 5: DASHBOARD */}
                        {activeTab === 'tracker' && (
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                                    <h2 className="text-2xl font-bold text-white mb-2 flex items-center gap-2">
                                        <span>📊</span> Course Progress Dashboard
                                    </h2>
                                    <p className="text-slate-300 text-sm">Overview of your Unit 1 progress across all sections.</p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                                        <span className="text-xs text-slate-400 font-semibold block">Sections Viewed</span>
                                        <span className="text-3xl font-extrabold text-cyan-400 mt-1 block">{completedSections.length} / 18</span>
                                    </div>
                                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                                        <span className="text-xs text-slate-400 font-semibold block">Current Active Section</span>
                                        <span className="text-3xl font-extrabold text-indigo-400 mt-1 block">Section {activeSectionId}</span>
                                    </div>
                                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                                        <span className="text-xs text-slate-400 font-semibold block">Total Objectives Tracked</span>
                                        <span className="text-3xl font-extrabold text-emerald-400 mt-1 block">19 / 19</span>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Chatbot */}
                    {isChatMinimized ? (
                        <button 
                            onClick={() => setIsChatMinimized(false)}
                            className="fixed bottom-4 right-4 z-50 bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2 font-bold text-xs">
                            <span>🤖 Ask AI Tutor</span>
                        </button>
                    ) : (
                        <div className="fixed bottom-4 right-4 z-50 w-full sm:w-80 md:w-96 glass-panel rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col max-h-[460px]">
                            <div className="p-3 bg-gradient-to-r from-indigo-700 to-purple-800 text-white font-bold text-xs flex justify-between items-center">
                                <span>🤖 Chemistry Tutor</span>
                                <button onClick={() => setIsChatMinimized(true)} className="text-white font-bold px-2">_</button>
                            </div>
                            <div className="p-3 overflow-y-auto space-y-2 text-xs bg-slate-900/90 h-60">
                                {chatMessages.map((msg, i) => (
                                    <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`p-2.5 rounded-xl max-w-[85%] ${msg.sender === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-200 border border-slate-700'}`}>
                                            {msg.text}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <form onSubmit={handleSendMessage} className="p-2 bg-slate-800 border-t border-slate-700 flex gap-2">
                                <input 
                                    type="text" 
                                    placeholder={`Ask a question about Section ${activeSectionId}...`}
                                    value={chatInput} 
                                    onChange={(e) => setChatInput(e.target.value)}
                                    className="flex-grow bg-slate-900 text-xs text-slate-200 p-2 rounded-lg border border-slate-700 focus:outline-none"
                                />
                                <button type="submit" className="px-3 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold">Send</button>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ChemistryApp />);
    </script>
</body>
</html>
